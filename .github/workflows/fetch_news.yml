name: Fetch Data and Commit

# Runs every 6 hours so the script can merge new API results into the
# existing 7-day rolling cache (up to 1000 unique articles per file).
on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'py-script/fetch_news.py'
      - 'py-script/requirements.txt'
      - '.github/workflows/fetch_news.yml'

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r py-script/requirements.txt

      - name: Fetch and merge news data
        run: python py-script/fetch_news.py ${{ secrets.News_API_KEY }}

      - name: Commit rolling news cache
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"

          git add public/data/

          if git diff --staged --quiet; then
            echo "No changes to public/data/ — nothing to commit"
            exit 0
          fi

          git commit -m "Update news data"
          git push origin main
